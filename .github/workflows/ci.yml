name: CPU CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  stdlib:
    name: Standard library / Python 3.12.14
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          architecture: x64
      - name: Create isolated standard-library environment
        run: |
          python -m venv .venv
          .venv/bin/python - <<'PY'
          import importlib.util
          import sys
          assert sys.version_info[:3] == (3, 12, 14), sys.version
          for name in ("torch", "numpy", "onnx", "onnxruntime", "cv2"):
              assert importlib.util.find_spec(name) is None, f"unexpected optional dependency: {name}"
          print(sys.version)
          PY
      - name: Compile all Python sources
        run: .venv/bin/python -m compileall -q model_platform scripts tests
      - name: Run all base regressions (optional dependency tests may skip)
        run: .venv/bin/python -m unittest discover -s tests -v

  optional-ml:
    name: Optional ML / CPU ONNX
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          architecture: x64
      - name: Install the hash-locked CPU stack
        run: |
          python -m venv .venv-fashion
          .venv-fashion/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-detection.lock -r requirements-pretrained.lock
          .venv-fashion/bin/python -m pip check
      - name: Verify optional dependencies and CPU runtime
        run: |
          .venv-fashion/bin/python - <<'PY'
          import sys
          import cv2
          import numpy
          import onnx
          import onnxruntime
          import onnxscript
          import torch
          import PIL
          import pycocotools.cocoeval
          assert sys.version_info[:3] == (3, 12, 14), sys.version
          assert torch.version.cuda is None, "CPU-only PyTorch is required"
          assert "CPUExecutionProvider" in onnxruntime.get_available_providers()
          for module in (numpy, onnx, onnxruntime, onnxscript, torch, cv2):
              print(f"{module.__name__}=={module.__version__}")
          PY
      - name: Run offline optional regressions with exact integration exclusions
        run: |
          .venv-fashion/bin/python - <<'PY'
          from collections import Counter
          import unittest
          discovered = unittest.defaultTestLoader.discover("tests")
          excluded_ids = {
              "test_fashion_data.OptionalOfficialCacheTests.test_full_source_is_reverified_offline": "official Fashion cache",
              "test_pretrained_yolox.ActualAssetTests.test_validation_load_predict_tamper": "private pretrained asset",
              "test_pretrained_yolox.UpstreamParityTests.test_exact_upstream_helpers": "private asset and pinned upstream sources",
              "test_import_serving.ImportedServingTests.test_lifecycle_restart_stop_replay": "private pretrained asset",
              "test_import_serving.ImportedServingTests.test_ownership_no_download_or_fake_evaluation": "private pretrained asset",
              "test_import_serving.ImportedServingTests.test_corruption_never_ready": "private pretrained asset",
          }
          def flatten(suite):
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      yield from flatten(test)
                  else:
                      yield test
          tests = list(flatten(discovered))
          counts = Counter(test.id() for test in tests)
          for excluded_id, reason in excluded_ids.items():
              if counts[excluded_id] != 1:
                  raise SystemExit(f"Expected exactly one {excluded_id}; discovered {counts[excluded_id]}")
              print(f"Explicitly excluded integration: {excluded_id} ({reason})")
          suite = unittest.TestSuite(test for test in tests if test.id() not in excluded_ids)
          print(f"Discovered {len(tests)} tests; selected {suite.countTestCases()}; explicitly excluded {len(excluded_ids)}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.testsRun or result.skipped or not result.wasSuccessful():
              raise SystemExit("Optional ML tests must run successfully with no skips")
          PY
